<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rockonhasemonha - Repertório</title>
  <!-- PapaParse para ler a planilha em tempo real -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 10px; }
    
    header {
      background-color: #212529; color: #fff; padding: 12px 20px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      border-radius: 6px; margin-bottom: 15px;
    }
    .user-info { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 10px; }
    .badge { background: #dc3545; color: white; padding: 2px 8px; border-radius: 4px; font-size: 11px; }
    .actions { display: flex; gap: 8px; }
    .btn { padding: 8px 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; text-decoration: none; font-size: 13px; }
    .btn-green { background-color: #198754; }
    .btn-blue { background-color: #0dcaf0; color: #000; }
    .btn-dark { background-color: #ffc107; color: #000; }
    .btn-red { background-color: #dc3545; }

    .search-bar { width: 100%; margin-bottom: 15px; }
    .search-bar input {
      width: 100%; padding: 12px; font-size: 15px; border: 1px solid #ced4da; border-radius: 6px;
    }

    .table-container { overflow-x: auto; background: white; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    th { background-color: #212529; color: white; padding: 10px; text-transform: uppercase; font-size: 11px; }
    td { padding: 10px; border-bottom: 1px solid #dee2e6; }
    tr:hover { background-color: #f1f3f5; }
    
    .filter-select, .filter-input {
      width: 100%; padding: 4px; font-size: 12px; border: 1px solid #ccc; border-radius: 4px; margin-top: 4px;
    }

    .btn-cifra {
      background-color: #dc3545; color: white; text-decoration: none; padding: 4px 10px;
      border-radius: 4px; font-weight: bold; font-size: 12px; display: inline-flex; align-items: center; gap: 4px;
    }
    
    .loading { text-align: center; padding: 20px; font-size: 16px; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <div class="user-info">
      👤 marcos.angelo@ifal.edu.br <span class="badge">ADMINISTRADOR</span>
    </div>
    <div class="actions">
      <button class="btn btn-dark" onclick="toggleDarkMode()">🌙 Escuro</button>
      <button class="btn btn-blue" onclick="exportarCSV()">⬇️ Exportar CSV</button>
      <button class="btn btn-green" onclick="abrirTelaCheia()">↗️ Tela Cheia</button>
      <button class="btn btn-red" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="search-bar">
    <input type="text" id="buscaGeral" placeholder="🔍 Busca Geral (Pesquise qualquer coisa aqui...)" oninput="filtrarData()">
  </div>

  <div class="table-container">
    <table id="tabelaRepertorio">
      <thead>
        <tr>
          <th>Nº</th>
          <th>Estilo<br><select id="filtroEstilo" class="filter-select" onchange="filtrarData()"><option value="">Todos</option></select></th>
          <th>Banda / Artista<br><select id="filtroBanda" class="filter-select" onchange="filtrarData()"><option value="">Todas</option></select></th>
          <th>Música<br><input type="text" id="filtroMusica" class="filter-input" placeholder="Música..." oninput="filtrarData()"></th>
          <th>Tom<br><select id="filtroTom" class="filter-select" onchange="filtrarData()"><option value="">Todos</option></select></th>
          <th>Cifra</th>
        </tr>
      </thead>
      <tbody id="corpoTabela">
        <tr><td colspan="6" class="loading">Carregando repertório da Planilha Google...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    // Link CSV fornecido da Planilha Google
    const PLANILHA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSX5NkwC4sig9rOBanE7OUNyWgoUFl7A2ICK8_sXxLtrx6ZxG-eGAiQebdC0Ss2eBcQxBmupP9zTKXM/pub?gid=1523365951&single=true&output=csv';

    let repertorioOriginal = [];

    function carregarPlanilha() {
      Papa.parse(PLANILHA_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          repertorioOriginal = results.data.map((item, index) => ({
            num: item['Seq.'] || item['Seq'] || (index + 1),
            estilo: item['Stilo'] || item['Estilo'] || '',
            banda: item['Banda'] || item['Artista'] || '',
            musica: item['Música'] || item['Musica'] || '',
            tom: item['Tom'] || '',
            cifra: item['Links das Cifras'] || item['Cifra'] || '#'
          })).filter(m => m.musica);

          preencherFiltros(repertorioOriginal);
          renderizarTabela(repertorioOriginal);
        },
        error: function(err) {
          document.getElementById('corpoTabela').innerHTML = '<tr><td colspan="6" style="color:red; text-align:center;">Erro ao carregar planilha. Verifique se a planilha está aberta para acesso.</td></tr>';
        }
      });
    }

    function preencherFiltros(dados) {
      const estilos = [...new Set(dados.map(d => d.estilo))].filter(Boolean).sort();
      const bandas = [...new Set(dados.map(d => d.banda))].filter(Boolean).sort();
      const tons = [...new Set(dados.map(d => d.tom))].filter(Boolean).sort();

      preencherSelect('filtroEstilo', estilos);
      preencherSelect('filtroBanda', bandas);
      preencherSelect('filtroTom', tons);
    }

    function preencherSelect(id, lista) {
      const select = document.getElementById(id);
      select.innerHTML = select.children[0].outerHTML;
      lista.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        select.appendChild(opt);
      });
    }

    function renderizarTabela(dados) {
      const corpo = document.getElementById('corpoTabela');
      corpo.innerHTML = '';

      if (dados.length === 0) {
        corpo.innerHTML = '<tr><td colspan="6" style="text-align:center;">Nenhuma música encontrada.</td></tr>';
        return;
      }

      dados.forEach((item) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.num}</td>
          <td>${item.estilo}</td>
          <td><b>${item.banda}</b></td>
          <td>${item.musica}</td>
          <td><b>${item.tom}</b></td>
          <td>
            ${item.cifra && item.cifra !== '#' ? `<a href="${item.cifra}" target="_blank" rel="noopener noreferrer" class="btn-cifra">📌 Cifra</a>` : '-'}
          </td>
        `;
        corpo.appendChild(tr);
      });
    }

    function filtrarData() {
      const busca = document.getElementById('buscaGeral').value.toLowerCase();
      const estilo = document.getElementById('filtroEstilo').value;
      const banda = document.getElementById('filtroBanda').value;
      const musica = document.getElementById('filtroMusica').value.toLowerCase();
      const tom = document.getElementById('filtroTom').value;

      const filtrados = repertorioOriginal.filter(item => {
        const atendeGeral = !busca || 
          item.estilo.toLowerCase().includes(busca) ||
          item.banda.toLowerCase().includes(busca) ||
          item.musica.toLowerCase().includes(busca) ||
          item.tom.toLowerCase().includes(busca);

        const atendeEstilo = !estilo || item.estilo === estilo;
        const atendeBanda = !banda || item.banda === banda;
        const atendeMusica = !musica || item.musica.toLowerCase().includes(musica);
        const atendeTom = !tom || item.tom === tom;

        return atendeGeral && atendeEstilo && atendeBanda && atendeMusica && atendeTom;
      });

      renderizarTabela(filtrados);
    }

    function abrirTelaCheia() { window.open(window.location.href, '_blank'); }
    function toggleDarkMode() { document.body.style.filter = document.body.style.filter ? '' : 'invert(0.9) hue-rotate(180deg)'; }
    function exportarCSV() {
      let csv = 'Nº,Estilo,Banda,Musica,Tom,Cifra\n';
      repertorioOriginal.forEach(r => { csv += `"${r.num}","${r.estilo}","${r.banda}","${r.musica}","${r.tom}","${r.cifra}"\n`; });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'repertorio_rockonha.csv';
      a.click();
    }
    function sair() { alert('Sessão encerrada.'); }

    carregarPlanilha();
  </script>
</body>
</html>
