<!-- Modal Unificada de Login e Cadastro (Obrigatório) -->
  <div id="modalAuth" class="modal-overlay" style="display: flex;">
    <div class="modal-content">
      <div class="auth-tabs">
        <div id="tabLogin" class="auth-tab active" onclick="alternarAbaAuth('login')">Login</div>
        <div id="tabCadastro" class="auth-tab" onclick="alternarAbaAuth('cadastro')">Novo Cadastro</div>
      </div>

      <!-- Formulário de Login -->
      <div id="formLogin">
        <input type="email" id="loginEmailInput" placeholder="Seu E-mail...">
        <input type="password" id="loginSenhaInput" placeholder="Sua Senha..." onkeyup="if(event.key==='Enter') executarLogin()">
        <div class="modal-buttons">
          <button class="btn btn-green" style="width: 100%;" onclick="executarLogin()">Entrar</button>
        </div>
      </div>

      <!-- Formulário de Cadastro -->
      <div id="formCadastro" style="display:none;">
        <input type="text" id="cadNomeInput" placeholder="Seu Nome...">
        <input type="email" id="cadEmailInput" placeholder="Seu E-mail...">
        <input type="password" id="cadSenhaInput" placeholder="Crie uma Senha...">
        <div class="modal-buttons">
          <button class="btn btn-purple" style="width: 100%;" onclick="executarCadastro()">Cadastrar e Entrar</button>
        </div>
      </div>
    </div>
  </div>
