<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rockonhasemonha - Repertório</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { background-color: #f4f6f9; color: #333; padding: 12px; }
    
    header {
      background-color: #212529; color: #fff; padding: 10px 16px;
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px;
      border-radius: 6px; margin-bottom: 12px;
    }
    .user-info { font-weight: bold; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .badge-admin { background: #dc3545; color: white; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
    
    .actions { display: flex; gap: 8px; }
    .btn { padding: 8px 14px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; color: white; text-decoration: none; font-size: 13px; display: inline-flex; align-items: center; gap: 4px; }
    .btn-dark { background-color: #ffc107; color: #000; }
    .btn-blue { background-color: #0dcaf0; color: #000; }
    .btn-green { background-color: #198754; color: #fff; }
    .btn-red { background-color: #dc3545; color: #fff; }

    .search-bar { width: 100%; margin-bottom: 12px; }
    .search-bar input {
      width: 100%; padding: 10px 14px; font-size: 14px; border: 1px solid #ced4da; border-radius: 6px; background: white;
    }

    .table-container { overflow-x: auto; background: white; border-radius: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.08); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
    
    thead { background-color: #212529; color: white; }
    thead tr.titles th { padding: 10px 8px 4px 8px; font-size: 11px; font-weight: bold; text-transform: uppercase; white-space: nowrap; }
    thead tr.filters th { padding: 4px 6px 10px 6px; }

    .filter-select, .filter-input {
      width: 100%; padding: 4px 6px; font-size: 12px; border: 1px solid #495057; border-radius: 4px; background: #fff; color: #212529;
    }

    tbody td { padding: 8px; border-bottom: 1px solid #dee2e6; vertical-align: middle; white-space: nowrap; }
    tbody tr:hover { background-color: #f8f9fa; }

    .tom-badge { background-color: #e9ecef; font-weight: bold; padding: 2px 8px; border-radius: 4px; color: #212529; display: inline-block; font-size: 12px; }
    .btn-cifra {
      background-color: #dc3545; color: white; text-decoration: none; padding: 4px 10px;
      border-radius: 4px; font-weight: bold; font-size: 11px; display: inline-flex; align-items: center; gap: 4px;
    }

    .btn-action {
      background: transparent; border: none; cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 12px; transition: transform 0.1s;
    }
    .btn-action:hover { transform: scale(1.2); }

    .pill-like { background-color: #e9ecef; border-radius: 12px; padding: 2px 10px; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; gap: 4px; border: 1px solid #ced4da; }
    .pill-like.active { background-color: #ffc107; color: #000; border-color: #ffc107; }

    .pill-acesso { background-color: #0d6efd; color: white; border-radius: 12px; padding: 2px 10px; font-size: 12px; font-weight: bold; display: inline-block; }
    
    .loading { text-align: center; padding: 25px; font-size: 15px; font-weight: bold; color: #555; }
  </style>
</head>
<body>

  <header>
    <div class="user-info">
      👤 marcos.angelo@ifal.edu.br <span class="badge-admin">ADMINISTRADOR</span>
    </div>
    <div class="actions">
      <button class="btn btn-dark" onclick="toggleDarkMode()">🌙 Escuro</button>
      <button class="btn btn-blue" onclick="exportarCSV()">⬇️ Exportar CSV</button>
      <button class="btn btn-green" id="btnTelaCheia" onclick="toggleTelaCheia()">↗️ Tela Cheia</button>
      <button class="btn btn-red" onclick="sair()">Sair</button>
    </div>
  </header>

  <div class="search-bar">
    <input type="text" id="buscaGeral" placeholder="🔍 Busca Geral (Pesquise qualquer coisa aqui...)" oninput="filtrarData()">
  </div>

  <div class="table-container">
    <table id="tabelaRepertorio">
      <thead>
        <tr class="titles">
          <th>Nº</th>
          <th>ESTILO</th>
          <th>BANDA / ARTISTA</th>
          <th>MÚSICA</th>
          <th>TOM</th>
          <th>CIFRA</th>
          <th>❤️ MEU</th>
          <th>👍 LIKES</th>
          <th>ACESSOS</th>
          <th>⚠️ ERRO</th>
        </tr>
        <tr class="filters">
          <th><input type="text" id="filtroNum" class="filter-input" placeholder="Nº..." oninput="filtrarData()"></th>
          <th><select id="filtroEstilo" class="filter-select" onchange="filtrarData()"><option value="">Todos</option></select></th>
          <th><select id="filtroBanda" class="filter-select" onchange="filtrarData()"><option value="">Todas</option></select></th>
          <th><input type="text" id="filtroMusica" class="filter-input" placeholder="Música..." oninput="filtrarData()"></th>
          <th><select id="filtroTom" class="filter-select" onchange="filtrarData()"><option value="">Todos</option></select></th>
          <th><select id="filtroCifra" class="filter-select" onchange="filtrarData()"><option value="">Todos</option></select></th>
          <th>
            <select id="filtroMeu" class="filter-select" onchange="filtrarData()">
              <option value="">Todas</option>
              <option value="fav">Favoritas (❤️)</option>
            </select>
          </th>
          <th>
            <select id="filtroLikes" class="filter-select" onchange="filtrarData()">
              <option value="">Todos</option>
              <option value="liked">Curtidas (👍)</option>
            </select>
          </th>
          <th><select id="filtroAcessos" class="filter-select" onchange="filtrarData()"><option value="">Todos</option></select></th>
          <th>
            <select id="filtroErro" class="filter-select" onchange="filtrarData()">
              <option value="">Todos</option>
              <option value="erro">Com Erro (⚠️)</option>
            </select>
          </th>
        </tr>
      </thead>
      <tbody id="corpoTabela">
        <tr><td colspan="10" class="loading">Carregando repertório da Planilha Google...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const PLANILHA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSX5NkwC4sig9rOBanE7OUNyWgoUFl7A2ICK8_sXxLtrx6ZxG-eGAiQebdC0Ss2eBcQxBmupP9zTKXM/pub?gid=1523365951&single=true&output=csv';
    
    // Insira aqui a URL do Web App gerada no Google Apps Script
    const SCRIPT_API_URL = ''; 

    let repertorioOriginal = [];
    let favoritos = JSON.parse(localStorage.getItem('rock_favs') || '[]');
    let likesLocais = JSON.parse(localStorage.getItem('rock_likes') || '{}');

    function carregarPlanilha() {
      Papa.parse(PLANILHA_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          repertorioOriginal = results.data.map((item, index) => {
            const erroValor = item['Erro'] || item['ERRO'] || '';
            const temErroConsolidado = erroValor.includes('⚠️') || erroValor.toLowerCase().includes('sim') || erroValor === '1';

            return {
              id: String(item['Seq.'] || item['Seq'] || (index + 1)),
              num: item['Seq.'] || item['Seq'] || (index + 1),
              estilo: item['Stilo'] || item['Estilo'] || '',
              banda: item['Banda'] || item['Artista'] || '',
              musica: item['Música'] || item['Musica'] || '',
              tom: item['Tom'] || '',
              cifra: item['Links das Cifras'] || item['Cifra'] || '#',
              likes: parseInt(item['Likes'] || '0', 10),
              acessos: parseInt(item['Acessos'] || '0', 10),
              temErro: temErroConsolidado
            };
          }).filter(m => m.musica);

          preencherFiltros(repertorioOriginal);
          renderizarTabela(repertorioOriginal);
        },
        error: function() {
          document.getElementById('corpoTabela').innerHTML = '<tr><td colspan="10" style="color:red; text-align:center;">Erro ao carregar planilha.</td></tr>';
        }
      });
    }

    function preencherFiltros(dados) {
      const estilos = [...new Set(dados.map(d => d.estilo))].filter(Boolean).sort();
      const bandas = [...new Set(dados.map(d => d.banda))].filter(Boolean).sort();
      const tons = [...new Set(dados.map(d => d.tom))].filter(Boolean).sort();

      preencherSelect('filtroEstilo', estilos);
      preencherSelect('filtroBanda', bandas);
      preencherSelect('filtroTom', tons);
    }

    function preencherSelect(id, lista) {
      const select = document.getElementById(id);
      select.innerHTML = select.children[0].outerHTML;
      lista.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item;
        opt.textContent = item;
        select.appendChild(opt);
      });
    }

    function renderizarTabela(dados) {
      const corpo = document.getElementById('corpoTabela');
      corpo.innerHTML = '';

      if (dados.length === 0) {
        corpo.innerHTML = '<tr><td colspan="10" style="text-align:center;">Nenhuma música encontrada.</td></tr>';
        return;
      }

      dados.forEach((item) => {
        const isFav = favoritos.includes(item.id);
        const hasLike = !!likesLocais[item.id];
        const totalLikes = item.likes + (hasLike ? 1 : 0);

        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.num}</td>
          <td>${item.estilo}</td>
          <td><b>${item.banda}</b></td>
          <td>${item.musica}</td>
          <td>${item.tom ? `<span class="tom-badge">${item.tom}</span>` : ''}</td>
          <td>
            ${item.cifra && item.cifra !== '#' ? `<a href="${item.cifra}" target="_blank" class="btn-cifra" onclick="registrarAcesso('${item.id}')">📌 Cifra</a>` : '-'}
          </td>
          <td>
            <button class="btn-action" onclick="toggleFavorito('${item.id}')" title="Favoritar (Meu)">
              ${isFav ? '❤️' : '🤍'}
            </button>
          </td>
          <td>
            <button class="btn-action pill-like ${hasLike ? 'active' : ''}" onclick="toggleLike('${item.id}')" title="Curtir">
              👍 ${totalLikes}
            </button>
          </td>
          <td><span class="pill-acesso" id="acesso-${item.id}">${item.acessos}</span></td>
          <td>
            <button class="btn-action" onclick="reportarErro('${item.id}', '${item.musica.replace(/'/g, "\\'")}')" title="Reportar erro ao Administrador">
              ${item.temErro ? '⚠️' : '🟣'}
            </button>
          </td>
        `;
        corpo.appendChild(tr);
      });
    }

    function registrarAcesso(id) {
      const item = repertorioOriginal.find(m => m.id === id);
      if (item) {
        item.acessos += 1;
        const elAcesso = document.getElementById(`acesso-${id}`);
        if (elAcesso) elAcesso.textContent = item.acessos;
      }

      if (SCRIPT_API_URL) {
        fetch(`${SCRIPT_API_URL}?id=${id}&action=acesso`, { mode: 'no-cors' });
      }
    }

    function toggleFavorito(id) {
      const idx = favoritos.indexOf(id);
      if (idx > -1) favoritos.splice(idx, 1);
      else favoritos.push(id);
      localStorage.setItem('rock_favs', JSON.stringify(favoritos));
      filtrarData();
    }

    function toggleLike(id) {
      if (likesLocais[id]) delete likesLocais[id];
      else likesLocais[id] = true;
      localStorage.setItem('rock_likes', JSON.stringify(likesLocais));
      filtrarData();
    }

    function reportarErro(id, titulo) {
      if (confirm(`Deseja notificar o Administrador sobre um erro na música "${titulo}"?`)) {
        if (SCRIPT_API_URL) {
          fetch(`${SCRIPT_API_URL}?id=${id}&action=erro`, { mode: 'no-cors' })
            .then(() => alert('Erro reportado ao Administrador com sucesso!'))
            .catch(() => alert('Falha ao enviar reporte.'));
        } else {
          alert('Erro sinalizado!');
        }
      }
    }

    function filtrarData() {
      const busca = document.getElementById('buscaGeral').value.toLowerCase();
      const num = document.getElementById('filtroNum').value.toLowerCase();
      const estilo = document.getElementById('filtroEstilo').value;
      const banda = document.getElementById('filtroBanda').value;
      const musica = document.getElementById('filtroMusica').value.toLowerCase();
      const tom = document.getElementById('filtroTom').value;
      const meu = document.getElementById('filtroMeu').value;
      const likesFilter = document.getElementById('filtroLikes').value;
      const erroFilter = document.getElementById('filtroErro').value;

      const filtrados = repertorioOriginal.filter(item => {
        const isFav = favoritos.includes(item.id);
        const hasLike = !!likesLocais[item.id];

        const atendeGeral = !busca || 
          String(item.num).toLowerCase().includes(busca) ||
          item.estilo.toLowerCase().includes(busca) ||
          item.banda.toLowerCase().includes(busca) ||
          item.musica.toLowerCase().includes(busca) ||
          item.tom.toLowerCase().includes(busca);

        const atendeNum = !num || String(item.num).toLowerCase().includes(num);
        const atendeEstilo = !estilo || item.estilo === estilo;
        const atendeBanda = !banda || item.banda === banda;
        const atendeMusica = !musica || item.musica.toLowerCase().includes(musica);
        const atendeTom = !tom || item.tom === tom;
        const atendeMeu = !meu || (meu === 'fav' && isFav);
        const atendeLikes = !likesFilter || (likesFilter === 'liked' && hasLike);
        const atendeErro = !erroFilter || (erroFilter === 'erro' && item.temErro);

        return atendeGeral && atendeNum && atendeEstilo && atendeBanda && atendeMusica && atendeTom && atendeMeu && atendeLikes && atendeErro;
      });

      renderizarTabela(filtrados);
    }

    function toggleTelaCheia() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        const el = document.documentElement;
        if (el.requestFullscreen) {
          el.requestFullscreen();
        } else if (el.webkitRequestFullscreen) {
          el.webkitRequestFullscreen();
        } else if (el.msRequestFullscreen) {
          el.msRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        } else if (document.webkitExitFullscreen) {
          document.webkitExitFullscreen();
        } else if (document.msExitFullscreen) {
          document.msExitFullscreen();
        }
      }
    }

    function toggleDarkMode() { document.body.style.filter = document.body.style.filter ? '' : 'invert(0.9) hue-rotate(180deg)'; }
    function exportarCSV() {
      let csv = 'Nº,Estilo,Banda,Musica,Tom,Cifra\n';
      repertorioOriginal.forEach(r => { csv += `"${r.num}","${r.estilo}","${r.banda}","${r.musica}","${r.tom}","${r.cifra}"\n`; });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'repertorio_rockonha.csv';
      a.click();
    }
    function sair() { alert('Sessão encerrada.'); }

    carregarPlanilha();
  </script>
</body>
</html>
