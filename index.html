<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rockonhasemonha - Organização de Repertório</title>
  <style>
    :root {
      --bg-color: #f4f6f9;
      --text-color: #333333;
      --card-bg: #ffffff;
      --header-bg: #222222;
      --border-color: #dddddd;
    }

    body.dark-mode {
      --bg-color: #121212;
      --text-color: #e0e0e0;
      --card-bg: #1e1e1e;
      --header-bg: #111111;
      --border-color: #444444;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      transition: background-color 0.3s, color 0.3s;
    }

    .hidden { display: none !important; }

    /* Tela de Login */
    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .login-card {
      background: var(--card-bg);
      padding: 35px 40px;
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    .login-card h2 {
      margin-bottom: 25px;
      font-size: 22px;
    }

    .input-group {
      margin-bottom: 15px;
    }

    .input-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .btn-primary {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-primary:hover {
      background-color: #0056b3;
    }

    .toggle-auth {
      margin-top: 15px;
      font-size: 13px;
    }

    .toggle-auth a {
      color: #007bff;
      text-decoration: none;
    }

    /* Barra Superior do App */
    .top-bar {
      background-color: var(--header-bg);
      color: white;
      padding: 12px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
    }

    .badge-admin {
      background-color: #dc3545;
      color: white;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      gap: 8px;
    }

    .top-actions button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      color: white;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .btn-dark-toggle { background-color: #e0a800; color: #222 !important; }
    .btn-export { background-color: #17a2b8; }
    .btn-fullscreen { background-color: #28a745; }
    .btn-logout { background-color: #dc3545; }

    .main-content {
      padding: 15px;
    }

    /* Busca Geral */
    .search-container {
      margin-bottom: 15px;
    }

    .search-container input {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid var(--border-color);
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 15px;
      background-color: var(--card-bg);
      color: var(--text-color);
    }

    /* Tabela */
    .table-responsive {
      overflow-x: auto;
      background: var(--card-bg);
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 13px;
      text-align: left;
    }

    th, td {
      padding: 10px 8px;
      border-bottom: 1px solid var(--border-color);
      vertical-align: middle;
    }

    th {
      background-color: #222222;
      color: #ffffff;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 12px;
    }

    .filter-row th {
      background-color: #333333;
      padding: 6px 4px;
    }

    .filter-row input, .filter-row select {
      width: 100%;
      padding: 4px;
      border-radius: 4px;
      border: 1px solid #666;
      box-sizing: border-box;
      font-size: 12px;
    }

    .btn-cifra {
      background-color: #d9534f;
      color: white;
      padding: 4px 10px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 12px;
      display: inline-block;
      font-weight: bold;
    }

    .badge-count {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
    }

    .badge-likes { background-color: #e2e3e5; color: #383d41; }
    .badge-access { background-color: #007bff; color: white; }
    .dot-status { height: 12px; width: 12px; background-color: #b197fc; border-radius: 50%; display: inline-block; }
  </style>
</head>
<body>

  <!-- TELA DE LOGIN -->
  <div id="login-screen" class="login-container">
    <div class="login-card">
      <h2 id="auth-title">Entrar no Rockonha</h2>
      <form id="auth-form" onsubmit="handleAuth(event)">
        <div class="input-group">
          <input type="email" id="email" placeholder="Seu E-mail" required>
        </div>
        <div class="input-group">
          <input type="password" id="password" placeholder="Sua Senha" required>
        </div>
        <button type="submit" class="btn-primary" id="btn-submit">Entrar</button>
      </form>
      <div class="toggle-auth">
        <a href="#" id="auth-toggle-link" onclick="toggleAuthMode(event)">Não tem conta? Cadastre-se aqui</a>
      </div>
    </div>
  </div>

  <!-- TELA PRINCIPAL DO REPERTÓRIO -->
  <div id="app-screen" class="hidden">
    <div class="top-bar">
      <div class="user-badge">
        👤 <span id="user-email-display">usuario@ifal.edu.br</span>
        <span class="badge-admin">ADMINISTRADOR</span>
      </div>
      <div class="top-actions">
        <button class="btn-dark-toggle" onclick="toggleDarkMode()">🌙 Escuro</button>
        <button class="btn-export" onclick="exportarCSV()">⬇️ Exportar CSV</button>
        <button class="btn-fullscreen" onclick="toggleTelaCheia()">↗️ Tela Cheia</button>
        <button class="btn-logout" onclick="fazerLogout()">Sair</button>
      </div>
    </div>

    <div class="main-content">
      <div class="search-container">
        <input type="text" id="global-search" placeholder="🔍 Busca Geral (Pesquise qualquer coisa aqui...)" oninput="filtrarTabela()">
      </div>

      <div class="table-responsive">
        <table id="repertorio-table">
          <thead>
            <tr>
              <th>Nº</th>
              <th>ESTILO</th>
              <th>BANDA / ARTISTA</th>
              <th>MÚSICA</th>
              <th>TOM</th>
              <th>CIFRA</th>
              <th>❤️ MEU</th>
              <th>👍 LIKES</th>
              <th>ACESSOS</th>
              <th>⚠️ ERRO</th>
            </tr>
            <tr class="filter-row">
              <th><input type="text" id="filter-no" oninput="filtrarTabela()" placeholder="Nº..."></th>
              <th>
                <select id="filter-estilo" onchange="filtrarTabela()">
                  <option value="">Todos</option>
                  <option value="Pop Rock Internacional">Pop Rock Internacional</option>
                  <option value="Pop Rock Nacional">Pop Rock Nacional</option>
                  <option value="Hard Rock">Hard Rock</option>
                </select>
              </th>
              <th>
                <select id="filter-banda" onchange="filtrarTabela()">
                  <option value="">Todas</option>
                  <option value="A-ha">A-ha</option>
                </select>
              </th>
              <th><input type="text" id="filter-musica" oninput="filtrarTabela()" placeholder="Música..."></th>
              <th>
                <select id="filter-tom" onchange="filtrarTabela()">
                  <option value="">Todos</option>
                  <option value="C">C</option>
                  <option value="D">D</option>
                  <option value="Bm">Bm</option>
                </select>
              </th>
              <th>
                <select id="filter-cifra" onchange="filtrarTabela()">
                  <option value="">Todos</option>
                </select>
              </th>
              <th>
                <select id="filter-meu" onchange="filtrarTabela()">
                  <option value="">Todas</option>
                </select>
              </th>
              <th>
                <select id="filter-likes" onchange="filtrarTabela()">
                  <option value="">Todos</option>
                </select>
              </th>
              <th>
                <select id="filter-acessos" onchange="filtrarTabela()">
                  <option value="">Todos</option>
                </select>
              </th>
              <th>
                <select id="filter-erro" onchange="filtrarTabela()">
                  <option value="">Todos</option>
                </select>
              </th>
            </tr>
          </thead>
          <tbody id="table-body">
            <!-- Linhas do repertório geradas dinamicamente -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // Banco de Dados Local do Repertório
    let repertorio = [
      { id: 1, estilo: "Pop Rock Internacional", banda: "A-ha", musica: "Hunting High And Low", tom: "C", cifra: "#", meu: false, likes: 0, acessos: 0, erro: false },
      { id: 2, estilo: "Pop Rock Internacional", banda: "A-ha", musica: "Stay On These Roads", tom: "D", cifra: "#", meu: false, likes: 0, acessos: 0, erro: false },
      { id: 3, estilo: "Pop Rock Internacional", banda: "A-ha", musica: "Take On Me", tom: "Bm", cifra: "#", meu: false, likes: 0, acessos: 1, erro: false },
      { id: 4, estilo: "Pop Rock Internacional", banda: "A-ha", musica: "Hunting High And Low", tom: "C", cifra: "#", meu: false, likes: 0, acessos: 0, erro: false },
      { id: 5, estilo: "Pop Rock Internacional", banda: "A-ha", musica: "Stay On These Roads", tom: "D", cifra: "#", meu: false, likes: 0, acessos: 0, erro: false },
      { id: 6, estilo: "Pop Rock Internacional", banda: "A-ha", musica: "Take On Me", tom: "Bm", cifra: "#", meu: false, likes: 0, acessos: 0, erro: false },
      { id: 7, estilo: "Pop Rock Internacional", banda: "A-ha", musica: "Take On Me", tom: "Bm", cifra: "#", meu: false, likes: 0, acessos: 0, erro: false }
    ];

    let isLoginMode = true;

    // Alternar entre Login e Cadastro
    function toggleAuthMode(event) {
      event.preventDefault();
      isLoginMode = !isLoginMode;
      document.getElementById('auth-title').innerText = isLoginMode ? 'Entrar no Rockonha' : 'Criar Conta no Rockonha';
      document.getElementById('btn-submit').innerText = isLoginMode ? 'Entrar' : 'Cadastrar';
      document.getElementById('auth-toggle-link').innerText = isLoginMode ? 'Não tem conta? Cadastre-se aqui' : 'Já tem conta? Faça login aqui';
    }

    // Processar Login
    function handleAuth(event) {
      event.preventDefault();
      const email = document.getElementById('email').value;
      document.getElementById('user-email-display').innerText = email;
      document.getElementById('login-screen').classList.add('hidden');
      document.getElementById('app-screen').classList.remove('hidden');
      renderTable(repertorio);
    }

    function fazerLogout() {
      document.getElementById('app-screen').classList.add('hidden');
      document.getElementById('login-screen').classList.remove('hidden');
    }

    // Renderizar Tabela de Músicas
    function renderTable(dados) {
      const tbody = document.getElementById('table-body');
      tbody.innerHTML = '';
      dados.forEach(item => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>${item.id}</td>
          <td>${item.estilo}</td>
          <td><strong>${item.banda}</strong></td>
          <td>${item.musica}</td>
          <td><span style="background:#eee; padding:2px 6px; border-radius:4px; font-weight:bold; color:#333;">${item.tom}</span></td>
          <td><a href="${item.cifra}" class="btn-cifra">🎸 Cifra</a></td>
          <td><span style="color:#ccc; cursor:pointer;">🤍</span></td>
          <td><span class="badge-count badge-likes">👍 ${item.likes}</span></td>
          <td><span class="badge-count badge-access">${item.acessos}</span></td>
          <td><span class="dot-status"></span></td>
        `;
        tbody.appendChild(tr);
      });
    }

    // Sistema de Filtros
    function filtrarTabela() {
      const global = document.getElementById('global-search').value.toLowerCase();
      const no = document.getElementById('filter-no').value.toLowerCase();
      const estilo = document.getElementById('filter-estilo').value;
      const banda = document.getElementById('filter-banda').value;
      const musica = document.getElementById('filter-musica').value.toLowerCase();
      const tom = document.getElementById('filter-tom').value;

      const filtrados = repertorio.filter(item => {
        const matchGlobal = Object.values(item).some(val => String(val).toLowerCase().includes(global));
        const matchNo = !no || String(item.id).includes(no);
        const matchEstilo = !estilo || item.estilo === estilo;
        const matchBanda = !banda || item.banda === banda;
        const matchMusica = !musica || item.musica.toLowerCase().includes(musica);
        const matchTom = !tom || item.tom === tom;

        return matchGlobal && matchNo && matchEstilo && matchBanda && matchMusica && matchTom;
      });

      renderTable(filtrados);
    }

    // Função do Botão "Tela Cheia"
    function toggleTelaCheia() {
      if (window.self !== window.top) {
        window.open(window.location.href, '_blank');
      } else {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen();
        } else {
          document.exitFullscreen();
        }
      }
    }

    // Modo Escuro
    function toggleDarkMode() {
      document.body.classList.toggle('dark-mode');
    }

    // Exportação em CSV
    function exportarCSV() {
      let csv = 'No,Estilo,Banda,Musica,Tom\n';
      repertorio.forEach(item => {
        csv += `${item.id},"${item.estilo}","${item.banda}","${item.musica}",${item.tom}\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'repertorio_rockonha.csv';
      a.click();
    }
  </script>
</body>
</html>
